function xpMultiplier(category){let total=0;for(const branch of SKILL_BRANCHES){if(branch.id===category||branch.id==='motion')for(const s of branch.skills)if(state.skills.includes(s.id))total+=s.bonus;}return 1+total/100;}
function taskXP(t){return Math.round(DIFFICULTIES[t.difficulty].xp*xpMultiplier(t.category));}
function isFulfilled(t){if(t.recurrence==='none')return !!t.done;if(t.recurrence==='weekly')return t.lastDoneKey===weekKey();return t.lastDoneKey===keyDate();}
function isAvailable(t){if(isFulfilled(t))return false;if(t.recurrence==='weekday'){const day=new Date().getDay();if(day===0||day===6)return false;}return true;}
function todayTasks(){return state.tasks.filter(t=>isAvailable(t)).sort((a,b)=>((a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:0));}

function openModal(html){const modal=$('#modal');modal.innerHTML=html;if(modal.open)modal.close();modal.showModal();}
function closeModal(){if($('#modal').open)$('#modal').close();pendingConfirm=null;}
function modalHeader(title){return `<div class="modal-head"><h2>${title}</h2><button class="icon-button" data-action="close-modal" aria-label="閉じる">${icon('x')}</button></div>`;}
function taskModal(id){const t=id?state.tasks.find(x=>x.id===id):null;const editing=!!t;const item=t||{title:'',category:'study',difficulty:'normal',minutes:25,recurrence:'none',due:''};openModal(`${modalHeader(editing?'クエストを編集':'新しいクエスト')}<form id="taskForm" data-id="${editing?esc(t.id):''}"><div class="modal-body"><div class="field"><label for="taskTitle">クエスト名 *</label><input id="taskTitle" name="title" class="field-input" placeholder="例：数学の問題を3問解く" value="${esc(item.title)}" required maxlength="90"></div><div class="field-row"><div class="field"><label for="taskCategory">分野</label><select class="select-input" name="category" id="taskCategory">${Object.entries(CATEGORIES).map(([k,c])=>`<option value="${k}" ${item.category===k?'selected':''}>${c.glyph} ${c.name}</option>`).join('')}</select></div><div class="field"><label for="taskDifficulty">難易度</label><select class="select-input" name="difficulty" id="taskDifficulty">${Object.entries(DIFFICULTIES).map(([k,d])=>`<option value="${k}" ${item.difficulty===k?'selected':''}>${d.name} · ${d.xp} XP</option>`).join('')}</select></div></div><div class="field-row"><div class="field"><label for="taskMinutes">目安時間（分）</label><input id="taskMinutes" name="minutes" type="number" min="0" max="1440" step="1" class="field-input" value="${item.minutes}"></div><div class="field"><label for="taskRepeat">繰り返し</label><select class="select-input" name="recurrence" id="taskRepeat">${Object.entries(RECURRENCES).map(([k,v])=>`<option value="${k}" ${item.recurrence===k?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label for="taskDue">締切（任意・単発向け）</label><input class="field-input" id="taskDue" name="due" type="date" value="${esc(item.due)}"><div class="field-help">未入力でもOK。過ぎたクエストも挑戦できます。</div></div></div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">キャンセル</button><button type="submit" class="btn btn-primary">${icon('check')} ${editing?'変更を保存':'クエストを作成'}</button></div></form>`);$('#taskTitle')?.focus();}
function rewardModal(id){const r=id?state.rewards.find(x=>x.id===id):null;const item=r||{title:'',detail:'',emoji:'🎁',cost:150};openModal(`${modalHeader(r?'ごほうびを編集':'新しいごほうび')}<form id="rewardForm" data-id="${r?esc(r.id):''}"><div class="modal-body"><div class="field"><label for="rewardTitle">ごほうびの名前 *</label><input class="field-input" id="rewardTitle" name="title" maxlength="80" value="${esc(item.title)}" placeholder="例：好きな漫画を読む" required></div><div class="field"><label for="rewardDetail">説明（任意）</label><input class="field-input" name="detail" id="rewardDetail" maxlength="180" value="${esc(item.detail)}" placeholder="ちょっとした楽しみを設定"></div><div class="field-row"><div class="field"><label for="rewardEmoji">アイコン（絵文字）</label><input class="field-input" name="emoji" id="rewardEmoji" maxlength="12" value="${esc(item.emoji)}"></div><div class="field"><label for="rewardCost">必要ゴールド *</label><input class="field-input" type="number" name="cost" id="rewardCost" min="1" max="999999" value="${item.cost}" required></div></div></div><div class="modal-foot"><button type="button" class="btn btn-ghost" data-action="close-modal">キャンセル</button><button type="submit" class="btn btn-primary">${icon('check')} ${r?'変更を保存':'ごほうびを作成'}</button></div></form>`);$('#rewardTitle')?.focus();}
function ask(title,message,callback,confirmLabel='実行する',danger=false){pendingConfirm=callback;openModal(`${modalHeader(esc(title))}<div class="modal-body"><p class="modal-copy">${esc(message)}</p></div><div class="modal-foot"><button class="btn btn-ghost" data-action="close-modal">キャンセル</button><button class="btn ${danger?'btn-danger':'btn-primary'}" data-action="confirm-yes">${esc(confirmLabel)}</button></div>`);}
function showLevelUp(lv){const dlg=$('#levelDialog');dlg.innerHTML=`<div class="level-inner"><div class="level-ornament">✦</div><div class="eyebrow">LEVEL UP!</div><div class="level-number"><span>Lv.</span> ${lv}</div><h2>レベルアップ！</h2><p>${esc(rank(lv))} になりました。<br>スキルポイントを獲得しました！</p><button class="btn btn-primary" data-action="close-level">冒険を続ける ${icon('arrow')}</button></div>`;if(dlg.open)dlg.close();dlg.showModal();}
function completeTask(id){const t=state.tasks.find(t=>t.id===id);if(!t||!isAvailable(t))return;const before=levelInfo(state.totalXp).level,xp=taskXP(t),gold=DIFFICULTIES[t.difficulty].gold,now=new Date();const date=keyDate(now);if(t.recurrence==='none')t.done=true;else t.lastDoneKey=t.recurrence==='weekly'?weekKey(now):date;state.completions.push({id:uid(),taskId:t.id,title:t.title,category:t.category,difficulty:t.difficulty,xp,gold,day:date,at:now.toISOString()});state.totalXp+=xp;state.gold+=gold;const unlocked=syncAchievements(),after=levelInfo(state.totalXp).level;save();render();toast(`✦ クエスト達成！ +${xp} XP / +${gold} G${unlocked.length?` · 実績 ${unlocked.length} 個解放！`:''}`);if(after>before)showLevelUp(after);}
function claimBonus(){const today=keyDate();if(completedToday()<3||state.bonusDays.includes(today))return;state.bonusDays.push(today);state.gold+=50;save();render();toast('✦ デイリーボーナス +50 G を受け取りました！');}
function buySkill(id){const branch=SKILL_BRANCHES.find(b=>b.skills.some(s=>s.id===id));if(!branch)return;const i=branch.skills.findIndex(s=>s.id===id),skill=branch.skills[i],level=levelInfo(state.totalXp).level;if(state.skills.includes(id)||level<skill.level||getSkillPoints()<skill.cost||(i>0&&!state.skills.includes(branch.skills[i-1].id)))return;state.skills.push(id);const unlocked=syncAchievements();save();render();toast(`✦ スキル「${skill.name}」を習得！${unlocked.length?' 実績も解放！':''}`);}
function redeemReward(id){const r=state.rewards.find(x=>x.id===id);if(!r||state.gold<r.cost)return;ask('ごほうびと交換',`「${r.title}」を ${r.cost} G で交換しますか？` ,()=>{if(state.gold<r.cost)return;state.gold-=r.cost;state.redemptions.push({id:uid(),title:r.title,cost:r.cost,at:new Date().toISOString()});const unlocked=syncAchievements();save();render();toast(`🎁 ${r.title} を交換しました！${unlocked.length?' 実績も解放！':''}`);},'交換する');}
function saveTask(form){const d=new FormData(form),title=String(d.get('title')||'').trim(),id=form.dataset.id;if(!title){toast('クエスト名を入力してください。');return;}const old=id?state.tasks.find(t=>t.id===id):null;const recurrence=String(d.get('recurrence')),data={title:title.slice(0,90),category:CATEGORIES[d.get('category')]?d.get('category'):'other',difficulty:DIFFICULTIES[d.get('difficulty')]?d.get('difficulty'):'normal',minutes:Math.max(0,Math.min(1440,Math.round(Number(d.get('minutes'))||0))),recurrence:RECURRENCES[recurrence]?recurrence:'none',due:String(d.get('due')||'')};if(old){const changed=old.recurrence!==data.recurrence;Object.assign(old,data);if(changed){old.done=false;old.lastDoneKey='';}}else{state.tasks.push({id:uid(),...data,done:false,lastDoneKey:'',createdAt:new Date().toISOString()});}closeModal();save();render();toast(old?'クエストを更新しました。':'新しいクエストを追加しました！');}
function saveReward(form){const d=new FormData(form),title=String(d.get('title')||'').trim(),id=form.dataset.id,cost=Number(d.get('cost'));if(!title||!Number.isFinite(cost)||cost<1||cost>999999){toast('名前とゴールドを正しく入力してください。');return;}const r=id?state.rewards.find(x=>x.id===id):null;const data={title:title.slice(0,80),detail:String(d.get('detail')||'').slice(0,180),emoji:String(d.get('emoji')||'🎁').slice(0,12)||'🎁',cost:Math.round(cost)};if(r)Object.assign(r,data);else state.rewards.push({id:uid(),...data});closeModal();save();render();toast(r?'ごほうびを更新しました。':'新しいごほうびを追加しました！');}
function exportData(){const json=JSON.stringify(state,null,2),blob=new Blob([json],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`QUESTLOG_backup_${keyDate()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('バックアップファイルを書き出しました。');}
async function importData(file){if(!file)return;try{if(file.size>15*1024*1024)throw Error('ファイルが大きすぎます（上限15MB）');const data=validateState(JSON.parse(await file.text()));ask('バックアップを復元',`「${file.name}」のデータに入れ替えます。現在のデータは上書きされますが、よろしいですか？`,()=>{state=data;syncAchievements();save();ui.questQuery='';navigate('home');toast('バックアップを復元しました。');},'復元する',true);}catch(e){toast(`読み込みに失敗しました：${e.message}`);}}
function resetData(){ask('すべて初期化', '現在のクエスト、経験値、ゴールド、実績、スキル、履歴を削除して初期状態に戻します。元には戻せません。',()=>{state=makeDefaultState();save();ui.questQuery='';navigate('home');toast('新しい冒険を始めました。');},'完全に初期化',true);}
function refreshQuestRows(){if(ui.route!=='quests')return;const list=$('#questRows');if(!list)return;list.innerHTML=renderQuestRows();const count=$('#questListCount');if(count)count.textContent=`${state.tasks.filter(taskMatchesFilter).length}件`;}
document.addEventListener('click',e=>{if(e.target===$('#mobileBackdrop')){setMenu(false);return;}const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const act=btn.dataset.action,id=btn.dataset.id;switch(act){
 case 'toggle-menu':setMenu(!ui.menuOpen);break;
 case 'nav':navigate(btn.dataset.route);break;
 case 'new-task':taskModal();break;
 case 'edit-task':taskModal(id);break;
 case 'delete-task':{const t=state.tasks.find(x=>x.id===id);if(t)ask('クエストの削除',`「${t.title}」を削除しますか？過去の達成履歴は残ります。`,()=>{state.tasks=state.tasks.filter(x=>x.id!==id);save();render();toast('クエストを削除しました。');},'削除する',true);break;}
 case 'complete-task':completeTask(id);break;
 case 'quest-tab':ui.questTab=btn.dataset.tab;render();break;
 case 'claim-bonus':claimBonus();break;
 case 'buy-skill':buySkill(id);break;
 case 'new-reward':rewardModal();break;
 case 'edit-reward':rewardModal(id);break;
 case 'delete-reward':{const r=state.rewards.find(x=>x.id===id);if(r)ask('ごほうびを削除',`「${r.title}」を削除しますか？交換履歴は残ります。`,()=>{state.rewards=state.rewards.filter(x=>x.id!==id);save();render();toast('ごほうびを削除しました。');},'削除する',true);break;}
 case 'redeem-reward':redeemReward(id);break;
 case 'close-modal':closeModal();break;
 case 'confirm-yes':{const cb=pendingConfirm;closeModal();if(typeof cb==='function')cb();break;}
 case 'close-level':$('#levelDialog').close();break;
 case 'backup-export':exportData();break;
 case 'backup-import':$('#importInput').click();break;
 case 'reset-data':resetData();break;
 }});
document.addEventListener('submit',e=>{if(e.target.id==='taskForm'){e.preventDefault();saveTask(e.target);}else if(e.target.id==='rewardForm'){e.preventDefault();saveReward(e.target);}else if(e.target.id==='profileForm'){e.preventDefault();const d=new FormData(e.target),name=String(d.get('name')||'').trim();if(!name)return;state.profile.name=name.slice(0,30);state.profile.avatar=String(d.get('avatar')||'⚔️');save();render();toast('プロフィールを保存しました。');}});
document.addEventListener('input',e=>{if(e.target.id==='questSearch'){ui.questQuery=e.target.value;refreshQuestRows();}});
document.addEventListener('change',e=>{if(e.target.id==='questCategory'){ui.category=e.target.value;refreshQuestRows();}if(e.target.id==='importInput'){importData(e.target.files?.[0]);e.target.value='';}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal();});
$('#modal').addEventListener('close',()=>{pendingConfirm=null;});
window.addEventListener('hashchange',()=>{const route=location.hash.replace('#','');if(ROUTES.some(x=>x.id===route)){ui.route=route;render();}});
let lastDay=keyDate();setInterval(()=>{const current=keyDate();if(current!==lastDay){lastDay=current;render();}},60*1000);
const initial=location.hash.replace('#','');if(ROUTES.some(x=>x.id===initial))ui.route=initial;
const fresh=syncAchievements();if(fresh.length)save();render();
})();

</script>
</body>
</html>
